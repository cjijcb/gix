name: Create Orphan Branch

on:
  schedule:
    - cron: "0 0 */5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-orphan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create orphan branch
        run: |
          git config user.name "cjijcb"
          git config user.email "cjijcb@gmail.com"
          git checkout --orphan hydrogen
          git add --all
          git commit -m "hydrogen"
          git push origin hydrogen --force
