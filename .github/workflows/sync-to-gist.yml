name: Sync to Gist

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GIST_PAT_TOKEN }}
        run: |
          ruby << 'RUBY'
          require "json"
          require "net/http"
          require "uri"

          # Files to sync (repo path => gist filename)
          files = {
            "test0.md" => "test.md",
            "test1" => "test1.md"
          }

          # Build payload — read each file
          payload = {}
          files.each do |src, name|
            next puts("SKIP: #{src}") unless File.exist?(src)
            payload[name] = { content: File.read(src) }
            puts "OK: #{src} -> #{name}"
          end

          abort "ERROR: No files found." if payload.empty?

          # PATCH the Gist
          uri = URI("https://api.github.com/gists/#{ENV['GIST_ID']}")
          req = Net::HTTP::Patch.new(uri)
          req["Authorization"] = "token #{ENV['GH_TOKEN']}"
          req["Accept"] = "application/vnd.github+json"
          req["User-Agent"] = "gist-sync"
          req.body = { files: payload }.to_json

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |h| h.request(req) }

          abort "FAIL: HTTP #{res.code}\n#{res.body}" unless res.code == "200"
          puts "Done: #{JSON.parse(res.body)['html_url']}"
          RUBY
